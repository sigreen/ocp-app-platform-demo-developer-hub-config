kind: ConfigMap
apiVersion: v1
metadata:
  name: app-config-rhdh
  labels:
    app.kubernetes.io/name: backstage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  app-config-rhdh.yaml: |
    app:
      title: BMO Developer Hub
      baseUrl: https://{{ .Values.backstage.host }}

    # Confluence Integration
    confluence:                                               
      default:  # Named instance
        baseUrl: https://simongreen02.atlassian.net/wiki                                                                                                                   
        auth:
          type: basic
          email: ${CONFLUENCE_USERNAME}
          token: ${CONFLUENCE_TOKEN}  
      
        # Spaces to index for search (must match your space keys exactly)
        spaces:
          - ES                # Engineering Standards
          - PLATFORM          # Platform Documentation
          - ONBOARD          # Developer Onboarding

    lightspeed:
      # Disable topic validation to allow questions about Confluence docs and other RAG sources
      questionValidation: false

      # OPTIONAL: Custom users prompts displayed to users
      # If not provided, the plugin uses built-in default prompts
      prompts:
        - title: Using Lightspeed and MCP
          message: Tell me about the parasol-insurance-api API in the Catalog, and write a sample snippet of Java code to access it.

      mcpServers:
      - name: mcp::backstage
        token: ${BACKEND_SECRET}

      # RAG (Retrieval-Augmented Generation) Sources
      rag:
        enabled: true
        sources:
          # Confluence documentation
          - type: confluence
            enabled: true
            spaces:
              - ES
              - PLATFORM
              - ONBOARD
          
          # RHDH Catalog entities
          - type: catalog
            enabled: true
            entityKinds:
              - Component
              - API
              - System
          
          # TechDocs
          - type: techdocs
            enabled: true

      # OPTIONAL: Port for lightspeed service (default: 8080)
      # servicePort: ${LIGHTSPEED_SERVICE_PORT}

      # OPTIONAL: Override default RHDH system prompt
      systemPrompt: "You are a helpful assistant for developers using Red Hat Developer Hub. You can answer questions about RHDH, Backstage, the software catalog, APIs, and the team's engineering documentation from Confluence. Use the available context from RAG sources to provide accurate, helpful answers."

    search:
      collators:
        confluence:
          instanceKey: default  # Must match the named instance under confluence:
          # Schedule for indexing Confluence pages
          schedule:
            frequency: { hours: 2 }  # Index every 2 hours
            timeout: { minutes: 10 }
            initialDelay: { seconds: 30 }  # Run 30 seconds after startup

          # Confluence spaces to index (same as above)
          spaces:
            - ES
            - PLATFORM
            - ONBOARD

    signInPage: oidc
    auth:
      session:
        secret: ${BACKEND_SECRET}
      environment: production
      providers:
        oidc:
          production:
            prompt: login
            metadataUrl: https://{{ .Values.keycloak.host }}/realms/{{ .Values.keycloak.realm }}/.well-known/openid-configuration
            clientId: ${OAUTH_CLIENT_ID}
            clientSecret: ${OAUTH_CLIENT_SECRET}
            signIn:
              resolvers:
                - resolver: preferredUsernameMatchingUserEntityName

    
    backend:
      baseUrl: https://{{ .Values.backstage.host }}
      listen:
        port: 7007
        host: 0.0.0.0
      actions:
        pluginSources:
          - software-catalog-mcp-tool
          - techdocs-mcp-tool
      auth:
        externalAccess:
          - type: static
            options:
              token: ${BACKEND_SECRET}
              subject: api-access
      # Lightspeed-specific CSP and script-src/img-src directives
      csp:
        upgrade-insecure-requests: false
        img-src:
          - "'self'"
          - "data:"
          - https://img.freepik.com
          - https://cdn.dribbble.com
          - https://avatars.githubusercontent.com
          - https://api.dicebear.com
        script-src:
          - "'self'"
          - "'unsafe-eval'"
          - https://cdn.jsdelivr.net


    integrations:
      gitlab:
        - apiBaseUrl: https://{{ .Values.gitlab.host }}/api/v4
          baseUrl: https://{{ .Values.gitlab.host }}
          host: {{ .Values.gitlab.host }}
          token: ${GITLAB_TOKEN}

    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Template, Domain]
      locations:
        - type: url
          target: https://github.com/evanshortiss/from-ai-hype-to-platform-reality/blob/main/catalog/catalog-info.yaml
          rules:
            - allow: [Component, System, API, Resource, Location, Template, Domain, User, Group]
      providers:
        keycloakOrg:
          default:
            baseUrl: https://{{ .Values.keycloak.host }}
            realm: {{ .Values.keycloak.realm }}
            loginRealm: {{ .Values.keycloak.loginRealm }}
            clientId: ${KEYCLOAK_PLUGIN_CLIENT_ID}
            clientSecret: ${KEYCLOAK_PLUGIN_CLIENT_SECRET}
            schedule:
              frequency: { minutes: 2 }
              timeout: { minutes: 1 }
              initialDelay: { seconds: 15 }
        gitlab:
          gitlab:
            host: {{ .Values.gitlab.host }}
            branch: main
            fallbackBranch: main
            entityFilename: catalog-info.yaml
            schedule:
              frequency: { minutes: 5 }
              timeout: { minutes: 3 }

    argocd:
      appLocatorMethods:
        - type: config
          instances:
            - name: main
              url: https://{{ .Values.argocd.host }}
              username: admin
              password: ${ARGOCD_PASSWORD}
    servicenow:
      baseUrl: ${SERVICENOW_BASE_URL}
      username: ${SERVICENOW_USERNAME}
      password: ${SERVICENOW_PASSWORD}
    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - clusters:
            - name: dev-cluster
              url: {{ .Values.kubernetes.apiUrl }}
              authProvider: serviceAccount
              skipTLSVerify: true
              serviceAccountToken: ${KUBERNETES_SA_TOKEN}
          type: config
      customResources:
        - group: tekton.dev
          apiVersion: v1beta1
          plural: pipelineruns
        - group: tekton.dev
          apiVersion: v1beta1
          plural: taskruns
        - group: route.openshift.io
          apiVersion: v1
          plural: routes
