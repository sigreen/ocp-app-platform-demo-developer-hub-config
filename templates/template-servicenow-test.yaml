apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: servicenow-incident-test
  title: Create ServiceNow Incident (Test)
  description: Test template to create a ServiceNow incident
  tags:
    - servicenow
    - test
    - itsm
spec:
  owner: platform-team
  type: service

  parameters:
    - title: Incident Details
      required:
        - shortDescription
        - urgency
        - impact
      properties:
        shortDescription:
          title: Short Description
          type: string
          description: Brief summary of the incident
          default: "Test incident from RHDH"
        description:
          title: Description
          type: string
          description: Detailed description of the incident
          ui:widget: textarea
          default: "This is a test incident created from Red Hat Developer Hub to validate ServiceNow integration"
        urgency:
          title: Urgency
          type: string
          description: Urgency level
          enum:
            - "1"
            - "2"
            - "3"
          enumNames:
            - "1 - High"
            - "2 - Medium"
            - "3 - Low"
          default: "3"
        impact:
          title: Impact
          type: string
          description: Impact level
          enum:
            - "1"
            - "2"
            - "3"
          enumNames:
            - "1 - High"
            - "2 - Medium"
            - "3 - Low"
          default: "3"

  steps:
    - id: create-incident
      name: Create ServiceNow Incident
      action: servicenow:now:table:createRecord
      input:
        tableName: incident
        requestBody:
          short_description: ${{ parameters.shortDescription }}
          description: ${{ parameters.description }}
          urgency: ${{ parameters.urgency }}
          impact: ${{ parameters.impact }}
          caller_id: admin
        sysparmFields:
          - number
          - sys_id
          - state
          - short_description

    - id: log-incident
      name: Log Incident Details
      action: debug:log
      input:
        message: |
          ServiceNow Incident Created Successfully!

          Incident Number: ${{ steps['create-incident'].output.result.number }}
          Sys ID: ${{ steps['create-incident'].output.result.sys_id }}
          State: ${{ steps['create-incident'].output.result.state }}
          Description: ${{ steps['create-incident'].output.result.short_description }}

  output:
    links:
      - title: ServiceNow Incident
        url: https://dev394071.service-now.com/nav_to.do?uri=incident.do?sys_id=${{ steps['create-incident'].output.result.sys_id }}
        icon: servicenow
    text:
      - title: Incident Number
        content: ${{ steps['create-incident'].output.result.number }}
      - title: Incident Sys ID
        content: ${{ steps['create-incident'].output.result.sys_id }}
