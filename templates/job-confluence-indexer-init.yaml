apiVersion: batch/v1
kind: Job
metadata:
  name: confluence-search-indexer-init
  namespace: rhdh
  labels:
    app.kubernetes.io/name: backstage
    app.kubernetes.io/component: search-indexer
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage
        app.kubernetes.io/component: search-indexer
    spec:
      restartPolicy: OnFailure
      serviceAccountName: default
      containers:
        - name: confluence-indexer
          image: registry.redhat.io/ubi9/ubi-minimal:latest
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "Waiting 60 seconds for RHDH to be fully ready..."
              sleep 60

              echo "Starting initial Confluence search indexing at $(date)"

              # Trigger Confluence indexing
              RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
                "http://backstage-developer-hub:7007/api/search/refresh" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer ${BACKEND_SECRET}" \
                -d '{"type":"confluence"}')

              HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
              BODY=$(echo "$RESPONSE" | head -n-1)

              echo "HTTP Response Code: $HTTP_CODE"
              echo "Response Body: $BODY"

              if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 202 ]; then
                echo "Initial Confluence indexing triggered successfully"

                # Also trigger catalog and techdocs indexing
                echo "Triggering catalog indexing..."
                curl -s -X POST \
                  "http://backstage-developer-hub:7007/api/search/refresh" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer ${BACKEND_SECRET}" \
                  -d '{"type":"software-catalog"}'

                echo "Triggering techdocs indexing..."
                curl -s -X POST \
                  "http://backstage-developer-hub:7007/api/search/refresh" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer ${BACKEND_SECRET}" \
                  -d '{"type":"techdocs"}'

                exit 0
              else
                echo "Failed to trigger initial Confluence indexing"
                exit 1
              fi
          env:
            - name: BACKEND_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: BACKEND_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
