apiVersion: apps/v1
kind: Deployment
metadata:
  name: confluence-mcp-server
  namespace: rhdh
  labels:
    app: confluence-mcp-server
    app.kubernetes.io/name: confluence-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: confluence-mcp-server
  template:
    metadata:
      labels:
        app: confluence-mcp-server
    spec:
      containers:
      - name: mcp-server
        image: python:3.12-slim
        command:
        - /bin/bash
        - -c
        - |
          echo "Installing dependencies..."
          pip install --no-cache-dir flask atlassian-python-api
          echo "Starting HTTP MCP server..."
          python /app/confluence_mcp_http.py
        env:
        - name: CONFLUENCE_URL
          valueFrom:
            secretKeyRef:
              name: confluence-mcp-credentials
              key: CONFLUENCE_URL
        - name: CONFLUENCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: confluence-mcp-credentials
              key: CONFLUENCE_USERNAME
        - name: CONFLUENCE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: confluence-mcp-credentials
              key: CONFLUENCE_API_TOKEN
        volumeMounts:
        - name: mcp-server-code
          mountPath: /app
        ports:
        - containerPort: 8080
          name: http
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: mcp-server-code
        configMap:
          name: confluence-mcp-server
